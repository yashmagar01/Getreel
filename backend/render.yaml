services:
  - type: web
    name: reel-decoder-backend
    env: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: export PATH=$PATH:$(pwd)/bin && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: INSTAGRAM_COOKIES_PATH
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
